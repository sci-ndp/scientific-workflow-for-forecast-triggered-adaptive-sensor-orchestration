x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    logging: *bounded-logging
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  forecast-api:
    restart: unless-stopped
    logging: *bounded-logging
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    image: forecast-streaming-v2:latest
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - CDSAPI_URL=${CDSAPI_URL:-https://ads.atmosphere.copernicus.eu/api}
      - CDSAPI_KEY=${CDSAPI_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - AQ_MAX_DAYS=${AQ_MAX_DAYS:-1}
      - AQ_MAX_QUEUE_LENGTH=${AQ_MAX_QUEUE_LENGTH:-2}
      - AQ_MAX_ENQUEUES_PER_HOUR=${AQ_MAX_ENQUEUES_PER_HOUR:-2}
    volumes:
      - ${AQ_DATA_DIR:-./data}:/app/data
      - ${HOME}/.cdsapirc:/root/.cdsapirc:ro
    depends_on:
      - redis
    command: uvicorn src.forecast_api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  aurora-worker:
    restart: unless-stopped
    logging: *bounded-logging
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    image: forecast-streaming-v2:latest
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - CDSAPI_URL=${CDSAPI_URL:-https://ads.atmosphere.copernicus.eu/api}
      - CDSAPI_KEY=${CDSAPI_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - AQ_MAX_DAYS=${AQ_MAX_DAYS:-1}
      - AQ_MAX_QUEUE_LENGTH=${AQ_MAX_QUEUE_LENGTH:-2}
      - AQ_MAX_ENQUEUES_PER_HOUR=${AQ_MAX_ENQUEUES_PER_HOUR:-2}
    volumes:
      - ${AQ_DATA_DIR:-./data}:/app/data
      - ${HOME}/.cdsapirc:/root/.cdsapirc:ro
    depends_on:
      - redis
    command: rq worker aurora --url redis://redis:6379/0
